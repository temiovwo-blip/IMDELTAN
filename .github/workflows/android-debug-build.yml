name: Android development build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/customer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/customer/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build unconfigured development web assets
        run: npm run build
      - name: Sync native Android project
        run: npx cap sync android
      - name: Build debug APK (not for distribution)
        working-directory: apps/customer/android
        run: ./gradlew --no-daemon --max-workers=2 assembleDebug
      - name: Verify APK signature
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose android/app/build/outputs/apk/debug/app-debug.apk"
