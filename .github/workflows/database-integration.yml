name: Database integration (isolated PostgreSQL)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: imdeltan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d imdeltan_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: local_test_only
      PGDATABASE: imdeltan_test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Create simulated Supabase identity prerequisites
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $$
            SELECT nullif(current_setting('request.jwt.claim.sub', true), '')::uuid;
          $$;
          GRANT USAGE ON SCHEMA auth TO anon, authenticated;
          -- A minimal test double, not Supabase Storage itself.
          CREATE SCHEMA storage;
          CREATE TABLE storage.buckets (id text PRIMARY KEY, name text NOT NULL, public boolean NOT NULL, file_size_limit bigint, allowed_mime_types text[]);
          SQL
      - name: Apply the exact migrations to the disposable database
        run: |
          for migration in supabase/migrations/*.sql; do
            echo "Testing $migration"
            psql -v ON_ERROR_STOP=1 --single-transaction -f "$migration"
          done
      - name: Check RLS, grants and selected constraints
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $test$
          DECLARE t record; a uuid := gen_random_uuid(); b uuid := gen_random_uuid();
          BEGIN
            FOR t IN SELECT c.oid, c.relname, c.relrowsecurity FROM pg_class c
              JOIN pg_namespace s ON s.oid = c.relnamespace
              WHERE s.nspname = 'public' AND c.relkind = 'r'
            LOOP
              IF NOT t.relrowsecurity THEN RAISE EXCEPTION 'RLS missing on %', t.relname; END IF;
              IF has_table_privilege('anon', t.oid, 'SELECT,INSERT,UPDATE,DELETE') OR
                 has_table_privilege('authenticated', t.oid, 'SELECT,INSERT,UPDATE,DELETE') THEN
                RAISE EXCEPTION 'Unexpected client privilege on %', t.relname;
              END IF;
            END LOOP;
            IF EXISTS (SELECT 1 FROM storage.buckets) AND
              ((SELECT count(*) FROM storage.buckets) <> 6 OR
               EXISTS (SELECT 1 FROM storage.buckets WHERE public IS DISTINCT FROM false)) THEN
              RAISE EXCEPTION 'Bucket count or privacy is incorrect';
            END IF;
            INSERT INTO auth.users(id) VALUES (a), (b);
            INSERT INTO public.friend_requests(sender_id, recipient_id) VALUES (a, b);
            BEGIN
              INSERT INTO public.friend_requests(sender_id, recipient_id) VALUES (b, a);
              RAISE EXCEPTION 'Reciprocal pending request accepted';
            EXCEPTION WHEN unique_violation THEN NULL; END;
            BEGIN
              INSERT INTO public.user_blocks(blocker_id, blocked_id) VALUES (a, a);
              RAISE EXCEPTION 'Self-block accepted';
            EXCEPTION WHEN check_violation THEN NULL; END;
            BEGIN
              INSERT INTO public.user_reports(reason) VALUES ('synthetic');
              RAISE EXCEPTION 'Targetless report accepted';
            EXCEPTION WHEN check_violation THEN NULL; END;
          END $test$;
          SQL
      - name: Check more database relationship rules
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $test$
          DECLARE a uuid := gen_random_uuid(); b uuid := gen_random_uuid();
            p1 uuid := gen_random_uuid(); p2 uuid := gen_random_uuid();
            comment1 uuid := gen_random_uuid(); conversation uuid := gen_random_uuid();
          BEGIN
            INSERT INTO auth.users(id) VALUES (a), (b);
            INSERT INTO public.posts(id, author_id, body) VALUES (p1, a, 'test'), (p2, a, 'test');
            INSERT INTO public.comments(id, post_id, author_id, body) VALUES (comment1, p1, a, 'test');
            BEGIN
              INSERT INTO public.comments(post_id, author_id, parent_id, body) VALUES (p2, a, comment1, 'test');
              RAISE EXCEPTION 'Cross-post reply accepted';
            EXCEPTION WHEN foreign_key_violation THEN NULL; END;
            BEGIN
              INSERT INTO public.reactions(user_id, kind) VALUES (a, 'like');
              RAISE EXCEPTION 'Reaction without target accepted';
            EXCEPTION WHEN check_violation THEN NULL; END;
            INSERT INTO public.reactions(user_id, post_id, kind) VALUES (a, p1, 'like');
            BEGIN
              INSERT INTO public.reactions(user_id, post_id, kind) VALUES (a, p1, 'like');
              RAISE EXCEPTION 'Duplicate reaction accepted';
            EXCEPTION WHEN unique_violation THEN NULL; END;
            BEGIN
              INSERT INTO public.user_eligibility(user_id, status) VALUES (a, 'eligible');
              RAISE EXCEPTION 'Unverified eligibility accepted';
            EXCEPTION WHEN check_violation THEN NULL; END;
            INSERT INTO public.conversations(id, created_by) VALUES (conversation, a);
            INSERT INTO public.conversation_participants(conversation_id, user_id) VALUES (conversation, a);
            BEGIN
              INSERT INTO public.messages(conversation_id, sender_id, body) VALUES (conversation, b, 'test');
              RAISE EXCEPTION 'Nonparticipant message accepted';
            EXCEPTION WHEN foreign_key_violation THEN NULL; END;
          END $test$;
          SQL
      - name: Test the private eligibility gate with synthetic users
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $test$
          DECLARE u uuid := gen_random_uuid(); v uuid := gen_random_uuid();
            policy_a uuid := gen_random_uuid(); policy_b uuid := gen_random_uuid();
          BEGIN
            INSERT INTO auth.users(id) VALUES (u), (v);
            INSERT INTO public.profiles(user_id, account_state) VALUES (u, 'active'), (v, 'active');
            INSERT INTO public.user_eligibility(user_id, status, verification_method, verification_version, verified_at)
              VALUES (u, 'eligible', 'test', 'test', now());
            IF app_private.user_passes_platform_gate(u) THEN RAISE EXCEPTION 'Missing policy accepted'; END IF;
            IF app_private.user_passes_platform_gate(NULL) THEN RAISE EXCEPTION 'Anonymous identity accepted'; END IF;
            INSERT INTO public.policy_versions(id, policy_key, version, content_url, content_sha256, mandatory, published_at)
              VALUES (policy_a, 'terms', '1', 'https://example.invalid/terms', repeat('a', 64), true, now());
            IF app_private.user_passes_platform_gate(u) THEN RAISE EXCEPTION 'Missing policy acceptance accepted'; END IF;
            INSERT INTO public.policy_acceptances(user_id, policy_version_id) VALUES (u, policy_a);
            IF NOT app_private.user_passes_platform_gate(u) THEN RAISE EXCEPTION 'Eligible identity rejected'; END IF;
            IF app_private.user_passes_platform_gate(v) THEN RAISE EXCEPTION 'Ineligible identity accepted'; END IF;
            INSERT INTO public.policy_versions(id, policy_key, version, content_url, content_sha256, mandatory, published_at)
              VALUES (policy_b, 'privacy', '1', 'https://example.invalid/privacy', repeat('b', 64), true, now());
            IF app_private.user_passes_platform_gate(u) THEN RAISE EXCEPTION 'New policy not enforced'; END IF;
            INSERT INTO public.policy_acceptances(user_id, policy_version_id) VALUES (u, policy_b);
            IF NOT app_private.user_passes_platform_gate(u) THEN RAISE EXCEPTION 'Policy-complete identity rejected'; END IF;
            UPDATE public.profiles SET account_state = 'suspended' WHERE user_id = u;
            IF app_private.user_passes_platform_gate(u) THEN RAISE EXCEPTION 'Suspended identity accepted'; END IF;
            IF has_function_privilege('anon', 'app_private.user_passes_platform_gate(uuid)', 'EXECUTE') OR
               has_function_privilege('authenticated', 'app_private.user_passes_platform_gate(uuid)', 'EXECUTE') THEN
              RAISE EXCEPTION 'Client can execute private gate';
            END IF;
          END $test$;
          SQL
      - name: Test private profile access when present
        run: |
          if [ "$(psql -Atqc "select to_regprocedure('app_private.current_user_passes_platform_gate()') is not null")" = "t" ]; then
            psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $test$
          DECLARE u uuid := gen_random_uuid(); other_user uuid := gen_random_uuid();
          BEGIN
            INSERT INTO auth.users(id) VALUES (u), (other_user);
            INSERT INTO public.profiles(user_id, account_state, display_name)
              VALUES (u, 'active', 'Test owner'), (other_user, 'active', 'Test other');
            INSERT INTO public.user_eligibility(user_id,status,verification_method,verification_version,verified_at)
              VALUES (u,'eligible','test','test',now()), (other_user,'eligible','test','test',now());
            INSERT INTO public.policy_acceptances(user_id,policy_version_id)
              SELECT u,id FROM public.policy_versions WHERE mandatory AND published_at <= now() AND retired_at IS NULL;
            PERFORM set_config('test.user_id', u::text, false);
            PERFORM set_config('test.other_user_id', other_user::text, false);
          END $test$;
          SET ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub', current_setting('test.user_id'), false);
          DO $test$
          DECLARE visible_count integer;
          BEGIN
            SELECT count(user_id) INTO visible_count FROM public.profiles;
            IF visible_count <> 1 THEN RAISE EXCEPTION 'Expected exactly own profile, got %', visible_count; END IF;
            BEGIN
              PERFORM account_state FROM public.profiles;
              RAISE EXCEPTION 'Private column visible';
            EXCEPTION WHEN insufficient_privilege THEN NULL; END;
          END $test$;
          SELECT set_config('request.jwt.claim.sub', current_setting('test.other_user_id'), false);
          DO $test$ DECLARE visible_count integer; BEGIN
            SELECT count(user_id) INTO visible_count FROM public.profiles;
            IF visible_count <> 0 THEN RAISE EXCEPTION 'Unaccepted policy exposed profile'; END IF;
          END $test$;
          RESET ROLE;
          SQL
          else
            echo "Profile read migration not present; test not applicable yet."
          fi
      - name: Test policy acceptance through authenticated role
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $test$
          DECLARE u uuid := gen_random_uuid(); suspended_user uuid := gen_random_uuid();
            current_policy uuid := gen_random_uuid(); retired_policy uuid := gen_random_uuid();
          BEGIN
            INSERT INTO auth.users(id) VALUES (u), (suspended_user);
            INSERT INTO public.profiles(user_id,account_state) VALUES (u,'pending'), (suspended_user,'suspended');
            INSERT INTO public.policy_versions(id,policy_key,version,content_url,content_sha256,mandatory,published_at,retired_at)
              VALUES (current_policy,'runtime-terms','1','https://example.invalid/terms',repeat('c',64),true,now(),null),
                     (retired_policy,'runtime-old','1','https://example.invalid/old',repeat('d',64),true,now() - interval '1 day',now());
            PERFORM set_config('test.accept_user',u::text,false);
            PERFORM set_config('test.suspended_user',suspended_user::text,false);
            PERFORM set_config('test.current_policy',current_policy::text,false);
            PERFORM set_config('test.retired_policy',retired_policy::text,false);
            IF has_function_privilege('anon', 'public.accept_current_policy(uuid)', 'EXECUTE') THEN
              RAISE EXCEPTION 'Anonymous policy acceptance allowed';
            END IF;
          END $test$;
          SET ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub',current_setting('test.accept_user'),false);
          SELECT public.accept_current_policy(current_setting('test.current_policy')::uuid);
          SELECT public.accept_current_policy(current_setting('test.current_policy')::uuid);
          DO $test$
          BEGIN
            BEGIN
              PERFORM public.accept_current_policy(current_setting('test.retired_policy')::uuid);
              RAISE EXCEPTION 'Retired policy accepted';
            EXCEPTION WHEN insufficient_privilege THEN NULL; END;
            BEGIN
              INSERT INTO public.policy_acceptances(user_id,policy_version_id)
                VALUES (current_setting('test.suspended_user')::uuid,current_setting('test.current_policy')::uuid);
              RAISE EXCEPTION 'Direct insert allowed';
            EXCEPTION WHEN insufficient_privilege THEN NULL; END;
          END $test$;
          SELECT set_config('request.jwt.claim.sub',current_setting('test.suspended_user'),false);
          DO $test$
          BEGIN
            BEGIN
              PERFORM public.accept_current_policy(current_setting('test.current_policy')::uuid);
              RAISE EXCEPTION 'Suspended account accepted policy';
            EXCEPTION WHEN insufficient_privilege THEN NULL; END;
          END $test$;
          RESET ROLE;
          DO $test$ DECLARE n integer; BEGIN
            SELECT count(*) INTO n FROM public.policy_acceptances
              WHERE user_id=current_setting('test.accept_user')::uuid
                AND policy_version_id=current_setting('test.current_policy')::uuid;
            IF n<>1 THEN RAISE EXCEPTION 'Expected one idempotent acceptance'; END IF;
            SELECT count(*) INTO n FROM public.policy_acceptances
              WHERE user_id=current_setting('test.suspended_user')::uuid;
            IF n<>0 THEN RAISE EXCEPTION 'Suspended acceptance recorded'; END IF;
          END $test$;
          SQL
      - name: Test policy listing for separate users
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $test$
          DECLARE a uuid := gen_random_uuid(); b uuid := gen_random_uuid();
            suspended uuid := gen_random_uuid(); current_policy uuid := gen_random_uuid();
            future_policy uuid := gen_random_uuid(); retired_policy uuid := gen_random_uuid();
          BEGIN
            INSERT INTO auth.users(id) VALUES (a),(b),(suspended);
            INSERT INTO public.profiles(user_id,account_state) VALUES (a,'pending'),(b,'pending'),(suspended,'suspended');
            INSERT INTO public.policy_versions(id,policy_key,version,content_url,content_sha256,mandatory,published_at,retired_at)
              VALUES (current_policy,'discovery-current','1','https://example.invalid/c',repeat('a',64),true,now(),null),
                     (future_policy,'discovery-future','1','https://example.invalid/f',repeat('b',64),true,now() + interval '1 day',null),
                     (retired_policy,'discovery-retired','1','https://example.invalid/r',repeat('c',64),true,now() - interval '1 day',now());
            INSERT INTO public.policy_acceptances(user_id,policy_version_id) VALUES(a,current_policy);
            PERFORM set_config('test.discovery_a',a::text,false);
            PERFORM set_config('test.discovery_b',b::text,false);
            PERFORM set_config('test.discovery_suspended',suspended::text,false);
            PERFORM set_config('test.discovery_policy',current_policy::text,false);
            PERFORM set_config('test.discovery_future',future_policy::text,false);
            PERFORM set_config('test.discovery_retired',retired_policy::text,false);
            IF has_function_privilege('anon','public.list_current_required_policies()','EXECUTE') THEN
              RAISE EXCEPTION 'Anonymous policy listing allowed';
            END IF;
          END $test$;
          SET ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub',current_setting('test.discovery_a'),false);
          DO $test$ DECLARE n integer; BEGIN
            SELECT count(*) INTO n FROM public.list_current_required_policies()
              WHERE id=current_setting('test.discovery_policy')::uuid AND accepted;
            IF n<>1 THEN RAISE EXCEPTION 'Own acceptance missing'; END IF;
            SELECT count(*) INTO n FROM public.list_current_required_policies()
              WHERE id IN (current_setting('test.discovery_future')::uuid,current_setting('test.discovery_retired')::uuid);
            IF n<>0 THEN RAISE EXCEPTION 'Future or retired policy shown'; END IF;
          END $test$;
          SELECT set_config('request.jwt.claim.sub',current_setting('test.discovery_b'),false);
          DO $test$ DECLARE n integer; BEGIN
            SELECT count(*) INTO n FROM public.list_current_required_policies()
              WHERE id=current_setting('test.discovery_policy')::uuid AND NOT accepted;
            IF n<>1 THEN RAISE EXCEPTION 'Acceptance leaked between users'; END IF;
          END $test$;
          SELECT set_config('request.jwt.claim.sub',current_setting('test.discovery_suspended'),false);
          DO $test$ BEGIN
            BEGIN
              PERFORM * FROM public.list_current_required_policies();
              RAISE EXCEPTION 'Suspended account can list policies';
            EXCEPTION WHEN insufficient_privilege THEN NULL; END;
          END $test$;
          RESET ROLE;
          SQL
      - name: Test profile edits with synthetic accounts
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $test$
          DECLARE a uuid := gen_random_uuid(); b uuid := gen_random_uuid(); pending uuid := gen_random_uuid();
          BEGIN
            INSERT INTO auth.users(id) VALUES (a),(b),(pending);
            INSERT INTO public.profiles(user_id,account_state,handle,display_name)
              VALUES (a,'active','old_handle','Old'),(b,'active','already_taken','Other'),(pending,'pending',null,'Pending');
            INSERT INTO public.user_eligibility(user_id,status,verification_method,verification_version,verified_at)
              VALUES (a,'eligible','test','test',now());
            INSERT INTO public.policy_acceptances(user_id,policy_version_id)
              SELECT a,id FROM public.policy_versions WHERE mandatory AND published_at <= now() AND retired_at IS NULL;
            PERFORM set_config('test.profile_editor',a::text,false);
            PERFORM set_config('test.profile_other',b::text,false);
            PERFORM set_config('test.profile_pending',pending::text,false);
            IF has_function_privilege('anon','public.update_own_profile(text,text,text)','EXECUTE') THEN
              RAISE EXCEPTION 'Anonymous profile updates allowed';
            END IF;
          END $test$;
          SET ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub',current_setting('test.profile_editor'),false);
          SELECT public.update_own_profile('  NEW_HANDLE  ','  New Name  ','  Hello  ');
          DO $test$
          BEGIN
            BEGIN
              PERFORM public.update_own_profile('bad handle!','Name','Bio');
              RAISE EXCEPTION 'Invalid handle accepted';
            EXCEPTION WHEN invalid_parameter_value THEN NULL; END;
            BEGIN
              PERFORM public.update_own_profile('already_taken','Name','Bio');
              RAISE EXCEPTION 'Duplicate handle accepted';
            EXCEPTION WHEN unique_violation THEN NULL; END;
            BEGIN
              UPDATE public.profiles SET display_name='Not permitted';
              RAISE EXCEPTION 'Direct update allowed';
            EXCEPTION WHEN insufficient_privilege THEN NULL; END;
          END $test$;
          SELECT set_config('request.jwt.claim.sub',current_setting('test.profile_pending'),false);
          DO $test$ BEGIN
            BEGIN
              PERFORM public.update_own_profile('pending_user','Name','Bio');
              RAISE EXCEPTION 'Pending account could edit';
            EXCEPTION WHEN insufficient_privilege THEN NULL; END;
          END $test$;
          RESET ROLE;
          DO $test$ DECLARE n integer; BEGIN
            SELECT count(*) INTO n FROM public.profiles WHERE user_id=current_setting('test.profile_editor')::uuid
              AND handle='new_handle' AND display_name='New Name' AND biography='Hello';
            IF n<>1 THEN RAISE EXCEPTION 'Profile update did not normalize fields'; END IF;
            SELECT count(*) INTO n FROM public.profiles WHERE user_id=current_setting('test.profile_other')::uuid
              AND handle='already_taken' AND display_name='Other';
            IF n<>1 THEN RAISE EXCEPTION 'Other profile changed'; END IF;
          END $test$;
          SQL
      - name: Test onboarding initialization with synthetic accounts
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $test$
          DECLARE new_user uuid := gen_random_uuid(); suspended_user uuid := gen_random_uuid();
            missing_user uuid := gen_random_uuid();
          BEGIN
            INSERT INTO auth.users(id) VALUES (new_user), (suspended_user);
            INSERT INTO public.profiles(user_id,account_state) VALUES (suspended_user,'suspended');
            INSERT INTO public.user_eligibility(user_id,status) VALUES (suspended_user,'revoked');
            INSERT INTO public.user_privacy_settings(user_id,profile_visibility) VALUES (suspended_user,'private');
            PERFORM set_config('test.new_onboarding_user',new_user::text,false);
            PERFORM set_config('test.suspended_onboarding_user',suspended_user::text,false);
            PERFORM set_config('test.missing_onboarding_user',missing_user::text,false);
            IF has_function_privilege('anon','public.initialize_own_onboarding()','EXECUTE') THEN
              RAISE EXCEPTION 'Anonymous onboarding initialization allowed';
            END IF;
          END $test$;
          SET ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub',current_setting('test.new_onboarding_user'),false);
          SELECT public.initialize_own_onboarding();
          SELECT public.initialize_own_onboarding();
          SELECT set_config('request.jwt.claim.sub',current_setting('test.suspended_onboarding_user'),false);
          SELECT public.initialize_own_onboarding();
          SELECT set_config('request.jwt.claim.sub',current_setting('test.missing_onboarding_user'),false);
          DO $test$ BEGIN
            BEGIN
              PERFORM public.initialize_own_onboarding();
              RAISE EXCEPTION 'Unknown identity accepted';
            EXCEPTION WHEN insufficient_privilege THEN NULL; END;
          END $test$;
          RESET ROLE;
          DO $test$ DECLARE n integer; BEGIN
            SELECT count(*) INTO n FROM public.profiles WHERE user_id=current_setting('test.new_onboarding_user')::uuid AND account_state='pending';
            IF n<>1 THEN RAISE EXCEPTION 'Pending profile initialization failed'; END IF;
            SELECT count(*) INTO n FROM public.user_eligibility WHERE user_id=current_setting('test.new_onboarding_user')::uuid AND status='pending';
            IF n<>1 THEN RAISE EXCEPTION 'Pending eligibility initialization failed'; END IF;
            SELECT count(*) INTO n FROM public.user_privacy_settings WHERE user_id=current_setting('test.new_onboarding_user')::uuid AND profile_visibility='private';
            IF n<>1 THEN RAISE EXCEPTION 'Private default initialization failed'; END IF;
            SELECT count(*) INTO n FROM public.profiles p JOIN public.user_eligibility e ON e.user_id=p.user_id
              WHERE p.user_id=current_setting('test.suspended_onboarding_user')::uuid AND p.account_state='suspended' AND e.status='revoked';
            IF n<>1 THEN RAISE EXCEPTION 'Existing suspended state was reset'; END IF;
          END $test$;
          SQL
      - name: Test adult self-declaration with synthetic accounts
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $test$
          DECLARE claimant uuid := gen_random_uuid(); revoked_user uuid := gen_random_uuid(); suspended_user uuid := gen_random_uuid();
          BEGIN
            INSERT INTO auth.users(id) VALUES (claimant),(revoked_user),(suspended_user);
            INSERT INTO public.profiles(user_id,account_state) VALUES (claimant,'pending'),(revoked_user,'pending'),(suspended_user,'suspended');
            INSERT INTO public.user_eligibility(user_id,status) VALUES (claimant,'pending'),(revoked_user,'revoked'),(suspended_user,'pending');
            PERFORM set_config('test.adult_claimant',claimant::text,false);
            PERFORM set_config('test.adult_revoked',revoked_user::text,false);
            PERFORM set_config('test.adult_suspended',suspended_user::text,false);
            IF has_function_privilege('anon','public.declare_adult_eligibility(boolean)','EXECUTE') THEN
              RAISE EXCEPTION 'Anonymous adult declaration allowed';
            END IF;
          END $test$;
          SET ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub',current_setting('test.adult_claimant'),false);
          DO $test$ BEGIN
            BEGIN
              PERFORM public.declare_adult_eligibility(false);
              RAISE EXCEPTION 'False declaration accepted';
            EXCEPTION WHEN insufficient_privilege THEN NULL; END;
            BEGIN
              PERFORM public.declare_adult_eligibility(NULL);
              RAISE EXCEPTION 'Null declaration accepted';
            EXCEPTION WHEN insufficient_privilege THEN NULL; END;
          END $test$;
          SELECT public.declare_adult_eligibility(true);
          SELECT set_config('request.jwt.claim.sub',current_setting('test.adult_revoked'),false);
          DO $test$ BEGIN
            BEGIN
              PERFORM public.declare_adult_eligibility(true);
              RAISE EXCEPTION 'Revoked eligibility reset';
            EXCEPTION WHEN insufficient_privilege THEN NULL; END;
          END $test$;
          SELECT set_config('request.jwt.claim.sub',current_setting('test.adult_suspended'),false);
          DO $test$ BEGIN
            BEGIN
              PERFORM public.declare_adult_eligibility(true);
              RAISE EXCEPTION 'Suspended user could declare';
            EXCEPTION WHEN insufficient_privilege THEN NULL; END;
          END $test$;
          RESET ROLE;
          DO $test$ DECLARE n integer; BEGIN
            SELECT count(*) INTO n FROM public.user_eligibility
              WHERE user_id=current_setting('test.adult_claimant')::uuid AND status='eligible'
                AND verification_method='adult_self_declaration' AND verification_version='1' AND verified_at IS NOT NULL;
            IF n<>1 THEN RAISE EXCEPTION 'Self-declaration not recorded correctly'; END IF;
            SELECT count(*) INTO n FROM public.user_eligibility WHERE user_id=current_setting('test.adult_revoked')::uuid AND status='revoked';
            IF n<>1 THEN RAISE EXCEPTION 'Revoked eligibility changed'; END IF;
            SELECT count(*) INTO n FROM public.user_eligibility WHERE user_id=current_setting('test.adult_suspended')::uuid AND status='pending';
            IF n<>1 THEN RAISE EXCEPTION 'Suspended eligibility changed'; END IF;
          END $test$;
          SQL
